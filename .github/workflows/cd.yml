name: CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  # Queue, don't cancel: killing a deploy mid-script can leave prod half-recreated
  # or with migrations unrun (a cancel after the old `down` step caused a ~4 min
  # outage on 2026-10-29). A queued run still deploys the latest main.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production (Contabo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 84.247.140.175
          username: root
          port: 222
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/noetia

            echo "── Pulling latest code ──────────────────────────"
            git pull origin main

            # Build while the current containers keep serving. (A full `down` used to
            # run first, which took the whole stack — db included — offline for the
            # entire build, ~6 min per deploy. The name conflicts it worked around came
            # from racing deploys, which the concurrency group above now prevents.)
            echo "── Building images (site stays up) ──────────────"
            docker compose --env-file .env.production -f docker-compose.server.yml build

            # Recreates only services whose image/config changed; db, cache, storage
            # and search keep running. --wait fails the deploy if a service never
            # turns healthy.
            echo "── Recreating changed containers ────────────────"
            docker compose --env-file .env.production -f docker-compose.server.yml up -d --remove-orphans --wait --wait-timeout 300

            echo "── Running migrations ───────────────────────────"
            docker compose --env-file .env.production -f docker-compose.server.yml exec -T -e DB_HOST=db api npm run migration:run:prod

            echo "── Cleaning up unused images ────────────────────"
            docker image prune -f

            echo "── Deploy complete ──────────────────────────────"
