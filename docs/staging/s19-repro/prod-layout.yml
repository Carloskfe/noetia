# S19 reproduction (NEM-016 report §16) — LOCAL ONLY, never on the server.
# Mirrors the prod network layout: api/web/storage on the project network + the
# shared external proxy network; db on the project network only. Names keep the
# real sort order: "zz" prefix on proxy and projects (noetia_noetia_net < proxy).
# Run as compose project "zznoetia". Each container answers TCP :9000 with its identity.
x-svc: &svc
  image: node:20-alpine
  command: ["node", "-e", "require('net').createServer(s=>s.end(process.env.WHO+'\\n')).listen(9000)"]
services:
  api:     { <<: *svc, environment: { WHO: "prod-api" },     networks: [noetia_net, proxy] }
  web:     { <<: *svc, environment: { WHO: "prod-web" },     networks: [noetia_net, proxy] }
  storage: { <<: *svc, environment: { WHO: "prod-storage" }, networks: [noetia_net, proxy] }
  db:      { <<: *svc, environment: { WHO: "prod-db" },      networks: [noetia_net] }
networks:
  noetia_net: { driver: bridge }
  proxy: { external: true, name: zzproxy }
