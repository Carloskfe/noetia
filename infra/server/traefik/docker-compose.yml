services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./acme.json:/acme.json
    networks:
      - proxy
      # Staging's dedicated Traefik network (NEM-017 / S19). Created with
      # `docker network create proxy_staging`; attach a running Traefik with
      # `docker network connect proxy_staging traefik` (no restart needed).
      - proxy_staging

networks:
  proxy:
    external: true
  proxy_staging:
    external: true
